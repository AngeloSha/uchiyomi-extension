# The same versions keiyoushi builds every extension with on 2026-09-13. tachiyomix 1.6.0 is compiled with
# Kotlin 2.4, so the extension has to be as well -- an older compiler cannot read its metadata.
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
tachiyomix = "1.6.0"
okhttp = "5.4.0"
serialization = "1.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
injekt = "1.16.1"
rxjava = "1.3.8"

[libraries]
tachiyomix = { module = "com.github.mihonapp:tachiyomix", version.ref = "tachiyomix" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
injekt = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injekt" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
