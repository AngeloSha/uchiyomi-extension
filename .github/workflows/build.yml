# Build, test, sign and publish the extension store.
#
# Every push and pull request builds and runs the JVM tests. A push to `main` additionally signs the APK with
# the release key (from secrets -- the keystore lives nowhere else), builds the JVM jar, regenerates every
# index format and force-pushes the result to the `repo` branch, which is what readers add as a store.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Only a push to main can sign: pull requests from forks cannot see secrets, and a PR build with the
      # debug key is exactly what a contributor wants to check anyway.
      - name: Release keystore
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "$SIGNING_KEY" | base64 -d > signingkey.jks; fi

      - name: Build and test
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease createReleaseExtensionJar sourceInfo

      - name: Signer fingerprint
        id: cert
        run: |
          APK=build/outputs/apk/release/uchiyomi-extension-release.apk
          # the runner image ships several build-tools versions; a bare glob hands apksigner two paths
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          FP=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          [ -n "$FP" ] || { echo "could not read the signer"; exit 1; }
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "signed by $FP"

      # The pinned id must survive every build: the store index says what it says because the build said so.
      - name: Source id is pinned
        run: |
          grep -q '^sourceId=8683375824843625513$' build/source-info.properties || { echo "source id changed"; exit 1; }

      - name: Build the store
        run: |
          python3 scripts/publish-repo.py \
            --apk build/outputs/apk/release/uchiyomi-extension-release.apk \
            --jar build/outputs/jar/tachiyomi-all.uchiyomi-v*.jar \
            --icon src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            --info build/source-info.properties \
            --fingerprint "${{ steps.cert.outputs.fingerprint }}" \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/repo" \
            --out store

      - uses: actions/upload-artifact@v4
        with:
          name: store
          path: store

      # A release build signed by the debug key must never reach the store: a reader that installed it would
      # have to uninstall to take the first real update. The fingerprint check is what enforces that.
      - name: Refuse to publish a debug-signed build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_FINGERPRINT: ${{ secrets.RELEASE_FINGERPRINT }}
        run: |
          [ "${{ steps.cert.outputs.fingerprint }}" = "$RELEASE_FINGERPRINT" ] || { echo "not signed with the release key"; exit 1; }

      - name: Publish the repo branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd store
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "store: $(grep '^versionName=' ../build/source-info.properties | cut -d= -f2) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
